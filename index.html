<script>

let API_KEY = localStorage.getItem('openrouter_key') || '';

if(API_KEY){
document.getElementById('apiKey').value = API_KEY;
}

const SYSTEM_PROMPT = `
Você é o AgroAssistente.

Especialista em:
- Pecuária de corte
- Manejo bovino
- Reprodução
- Nutrição animal
- Pastagem
- Mercado agro
- Confinamento

Sempre responda em português do Brasil.
Use linguagem prática e simples.
`;

function saveKey(){

const key = document.getElementById('apiKey').value.trim();

if(!key.startsWith('sk-or-')){
alert('API Key inválida');
return;
}

API_KEY = key;

localStorage.setItem('openrouter_key', key);

alert('API salva com sucesso');

}

function quickQuestion(el){

document.getElementById('input').value = el.innerText;

sendMessage();

}

function addMessage(text,type){

const empty = document.getElementById('empty');

if(empty){
empty.remove();
}

const chat = document.getElementById('chat');

const message = document.createElement('div');

message.className = 'message ' + type;

const avatar = document.createElement('div');

avatar.className = 'avatar ' + (type === 'user' ? 'user-avatar' : 'ai-avatar');

avatar.innerText = type === 'user' ? 'VC' : 'IA';

const bubble = document.createElement('div');

bubble.className = 'bubble ' + (type === 'user' ? 'user-bubble' : 'ai-bubble');

bubble.innerText = text;

message.appendChild(avatar);
message.appendChild(bubble);

chat.appendChild(message);

chat.scrollTop = chat.scrollHeight;

}

async function sendMessage(){

const input = document.getElementById('input');

const text = input.value.trim();

if(!text){
return;
}

if(!API_KEY){
alert('Salve sua API Key primeiro');
return;
}

addMessage(text,'user');

input.value = '';

try{

const response = await fetch(
'https://openrouter.ai/api/v1/chat/completions',
{
method:'POST',

headers:{
'Authorization':'Bearer ' + API_KEY,
'Content-Type':'application/json'
},

body:JSON.stringify({

model:'deepseek/deepseek-chat-v3-0324:free',

messages:[
{
role:'system',
content:SYSTEM_PROMPT
},
{
role:'user',
content:text
}
]

})

}
);

const data = await response.json();

console.log(data);

if(data.choices && data.choices[0]){

const reply = data.choices[0].message.content;

addMessage(reply,'ai');

}else if(data.error){

addMessage('Erro: ' + data.error.message,'ai');

}else{

addMessage('Não foi possível obter resposta.','ai');

}

}catch(error){

console.error(error);

addMessage('Erro de conexão.','ai');

}

}

document.getElementById('input').addEventListener('keydown', function(e){

if(e.key === 'Enter' && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});

</script>
