<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroAssistente</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--green-dark:#16361d;
--green:#2f6b3d;
--green-light:#5aa469;
--cream:#f4f0e8;
--white:#ffffff;
--border:#d7e2d3;
--text:#1d1d1d;
--muted:#6d6d6d;
}

body{
background:var(--green-dark);
font-family:'Sora',sans-serif;
height:100vh;
overflow:hidden;
}

#app{
max-width:500px;
height:100vh;
margin:auto;
background:var(--cream);
display:flex;
flex-direction:column;
}

.header{
background:var(--green-dark);
padding:50px 20px 18px;
display:flex;
align-items:center;
gap:14px;
}

.logo{
width:48px;
height:48px;
border-radius:14px;
background:var(--green-light);
display:flex;
align-items:center;
justify-content:center;
}

.logo svg{
width:24px;
height:24px;
fill:var(--green-dark);
}

.header-text{
flex:1;
}

.title{
font-family:'DM Serif Display',serif;
font-size:24px;
color:white;
}

.subtitle{
font-size:12px;
color:#cde5c8;
margin-top:3px;
}

.setup{
padding:12px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
gap:8px;
}

.setup input{
flex:1;
padding:12px;
border-radius:12px;
border:1px solid var(--border);
outline:none;
font-size:14px;
}

.setup button{
padding:0 16px;
border:none;
background:var(--green-dark);
color:white;
border-radius:12px;
cursor:pointer;
}

.chat{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:14px;
}

.chat::-webkit-scrollbar{
display:none;
}

.message{
display:flex;
gap:8px;
align-items:flex-end;
}

.message.user{
flex-direction:row-reverse;
}

.avatar{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:600;
color:white;
flex-shrink:0;
}

.ai-avatar{
background:var(--green-dark);
}

.user-avatar{
background:var(--green-light);
}

.bubble{
padding:12px 14px;
max-width:78%;
border-radius:18px;
line-height:1.6;
font-size:14px;
white-space:pre-wrap;
word-break:break-word;
}

.ai-bubble{
background:white;
border:1px solid var(--border);
color:var(--text);
border-radius:6px 18px 18px 18px;
}

.user-bubble{
background:var(--green);
color:white;
border-radius:18px 6px 18px 18px;
}

.suggestions{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 16px;
}

.suggestions::-webkit-scrollbar{
display:none;
}

.chip{
background:white;
border:1px solid var(--border);
padding:8px 14px;
border-radius:20px;
font-size:12px;
white-space:nowrap;
cursor:pointer;
}

.input-area{
padding:12px;
background:white;
border-top:1px solid var(--border);
display:flex;
gap:10px;
align-items:flex-end;
}

.input-wrap{
flex:1;
background:var(--cream);
border:1px solid var(--border);
border-radius:20px;
padding:10px 14px;
}

textarea{
width:100%;
border:none;
background:transparent;
resize:none;
outline:none;
font-family:'Sora',sans-serif;
font-size:14px;
max-height:100px;
}

.send{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:var(--green-dark);
color:white;
font-size:18px;
cursor:pointer;
flex-shrink:0;
}

.empty{
margin:auto;
text-align:center;
padding:30px;
opacity:.7;
}

.empty h2{
font-family:'DM Serif Display',serif;
color:var(--green-dark);
margin-bottom:10px;
}

.empty p{
font-size:14px;
color:var(--muted);
line-height:1.6;
}

</style>
</head>

<body>

<div id="app">

<div class="header">

<div class="logo">
<svg viewBox="0 0 24 24">
<path d="M12 2C9 2 6 4.5 6 8c0 2.5 1.5 4.5 3.5 5.5V20h5v-6.5C16.5 12.5 18 10.5 18 8c0-3.5-3-6-6-6z"/>
</svg>
</div>

<div class="header-text">
<div class="title">AgroAssistente</div>
<div class="subtitle">Especialista em pecuária de corte</div>
</div>

</div>

<div class="setup">

<input type="password" id="apiKey" placeholder="Cole sua API Key OpenRouter">

<button onclick="saveKey()">Salvar</button>

</div>

<div class="chat" id="chat">

<div class="empty" id="empty">
<h2>Olá, produtor!</h2>
<p>Pergunte sobre manejo, vacinação, pastagem, nutrição ou mercado agro.</p>
</div>

</div>

<div class="suggestions">
<div class="chip" onclick="quickQuestion(this)">Vacinação bovina</div>
<div class="chip" onclick="quickQuestion(this)">IATF</div>
<div class="chip" onclick="quickQuestion(this)">Confinamento</div>
<div class="chip" onclick="quickQuestion(this)">Pastagem</div>
<div class="chip" onclick="quickQuestion(this)">Custo por arroba</div>
</div>

<div class="input-area">

<div class="input-wrap">
<textarea id="input" placeholder="Digite sua pergunta..." rows="1"></textarea>
</div>

<button class="send" onclick="sendMessage()">➜</button>

</div>

</div>

<script>

let API_KEY = localStorage.getItem('openrouter_key') || '';

if(API_KEY){
document.getElementById('apiKey').value = API_KEY;
}

const SYSTEM_PROMPT = `
Você é o AgroAssistente.

Especialista em:
- Pecuária de corte
- Manejo bovino
- Reprodução
- Nutrição animal
- Pastagem
- Mercado agro
- Confinamento

Sempre responda em português do Brasil.

Use linguagem prática e simples.
`;

function saveKey(){

const key = document.getElementById('apiKey').value.trim();

if(!key.startsWith('sk-or-')){
alert('API Key inválida');
return;
}

API_KEY = key;

localStorage.setItem('openrouter_key', key);

alert('API salva com sucesso');

}

function quickQuestion(el){

document.getElementById('input').value = el.innerText;

sendMessage();

}

function addMessage(text,type){

const empty = document.getElementById('empty');

if(empty){
empty.remove();
}

const chat = document.getElementById('chat');

const message = document.createElement('div');

message.className = 'message ' + type;

const avatar = document.createElement('div');

avatar.className = 'avatar ' + (type === 'user' ? 'user-avatar' : 'ai-avatar');

avatar.innerText = type === 'user' ? 'VC' : 'IA';

const bubble = document.createElement('div');

bubble.className = 'bubble ' + (type === 'user' ? 'user-bubble' : 'ai-bubble');

bubble.innerText = text;

message.appendChild(avatar);

message.appendChild(bubble);

chat.appendChild(message);

chat.scrollTop = chat.scrollHeight;

}

async function sendMessage(){

const input = document.getElementById('input');

const text = input.value.trim();

if(!text){
return;
}

if(!API_KEY){
alert('Salve sua API Key primeiro');
return;
}

addMessage(text,'user');

input.value = '';

try{

const response = await fetch(
'https://openrouter.ai/api/v1/chat/completions',
{
method:'POST',

headers:{
'Authorization':'Bearer ' + API_KEY,
'Content-Type':'application/json'
},

body:JSON.stringify({

model:'openai/gpt-4o-mini',

messages:[
{
role:'system',
content:SYSTEM_PROMPT
},
{
role:'user',
content:text
}
]

})

}
);

const data = await response.json();

console.log(data);

if(data.choices && data.choices[0]){

const reply = data.choices[0].message.content;

addMessage(reply,'ai');

}else if(data.error){

addMessage('Erro: ' + data.error.message,'ai');

}else{

addMessage('Não foi possível obter resposta.','ai');

}

}catch(error){

console.error(error);

addMessage('Erro de conexão.','ai');

}

}

document.getElementById('input').addEventListener('keydown',function(e){

if(e.key === 'Enter' && !e.shiftKey'){

e.preventDefault();

sendMessage();

}

});

</script>

</body>
</html>
